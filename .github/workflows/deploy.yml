name: Build and Deploy to Alibaba Cloud

on:
  push:
    branches:
      - master # 触发分支：当 master 分支收到 push 提交时自动运行

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 配置 Java 17 环境以编译后端
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. 编译后端 (Spring Boot)
      - name: Build Spring Boot JAR
        run: |
          cd api
          mvn clean package -DskipTests

      # 4. 配置 Node.js 环境以编译前端
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: view/package-lock.json

      # 5. 编译前端 (Vite + TS)
      - name: Build Vite Frontend
        run: |
          cd view
          npm install
          npm run build
        env:
          VITE_API_BASE_URL: https://api.admys.cn/api

      # 6. 通过 SCP 安全将编译好的文件上传到阿里云服务器
      # 这里会将后端 JAR 包传到 /var/www/yashe/backend/
      # 将前端静态文件传到 /var/www/yashe/frontend/
      - name: Copy Files to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "api/target/yashe-api-1.0.0.jar"
          target: "/var/www/yashe/backend/"
          strip_components: 2 # 剥离前两级目录前缀 (api/target/)，使 JAR 直接放入 backend/

      - name: Copy Frontend Files to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "view/dist/*"
          target: "/var/www/yashe/frontend/"
          strip_components: 2 # 剥离前两级目录前缀 (view/dist/)，使静态文件直接放入 frontend/

      # 7. 通过 SSH 远程重启服务器上的 Spring Boot 后端服务
      - name: Restart Backend Service via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            systemctl restart yashe-api
            systemctl status yashe-api
