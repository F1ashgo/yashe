server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  datasource:
    url: ${YASHE_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/yashe_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}}
    username: ${YASHE_DB_USERNAME:${DB_USERNAME:root}}
    password: ${YASHE_DB_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.yashe.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${YASHE_JWT_SECRET:${JWT_SECRET:YasheAtelierDesMiyabiLongSuperSecretKey12345}}
  expiration: ${YASHE_JWT_ACCESS_TTL:${JWT_EXPIRATION:PT60M}}
  issuer: ${YASHE_JWT_ISSUER:yashe-api}
  audience: ${YASHE_JWT_AUDIENCE:yashe-web}

app:
  cors:
    allowed-origins: ${YASHE_ALLOWED_ORIGINS:${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}}
  turnstile:
    secret: ${YASHE_TURNSTILE_SECRET_KEY:${TURNSTILE_SECRET_KEY:}}